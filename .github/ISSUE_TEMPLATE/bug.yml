name: CLI, daemon, or packaging bug
description: Report a reproducible software or installation problem
title: "[bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include device UIDs, serial numbers, firmware images, or other private hardware data.
        Report vulnerabilities through GitHub's private Security Advisory page.
  - type: input
    id: version
    attributes:
      label: wireview version
      description: Paste the complete output of `wireview version`.
    validations:
      required: true
  - type: input
    id: distribution
    attributes:
      label: Distribution and version
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Installation method
      options:
        - Debian or Ubuntu package
        - Fedora RPM package
        - Arch package
        - Built from source
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Sanitized output or logs
      description: Include relevant CLI output or `journalctl -u wireviewd.service`. Remove device identifiers.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed device UIDs, serial numbers, firmware images, and other private data.
          required: true
