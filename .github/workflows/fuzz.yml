name: Fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  parsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: nightly-2026-07-30
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libudev-dev
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz configuration parser
        run: cargo +nightly-2026-07-30 fuzz run configuration -- -runs=20000 -max_len=4096
      - name: Fuzz history parser
        run: cargo +nightly-2026-07-30 fuzz run history -- -runs=20000 -max_len=65536
      - name: Fuzz protocol parsers
        run: cargo +nightly-2026-07-30 fuzz run protocol -- -runs=20000 -max_len=512
