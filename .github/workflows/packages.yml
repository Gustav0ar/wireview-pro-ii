name: Packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/packages.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'CONTEXT.md'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'docs/desktop.md'
      - 'src/**'
      - 'interfaces/**'
      - 'packaging/**'
      - 'scripts/build-*.sh'
      - 'scripts/install-staged.sh'
      - 'scripts/project-metadata.sh'
      - 'scripts/smoke-gui.sh'
      - 'scripts/validate-packaging.sh'
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'Cargo.toml'

permissions:
  contents: read

jobs:
  release-plan:
    runs-on: ubuntu-24.04
    outputs:
      build_id: ${{ steps.plan.outputs.build_id }}
      mode: ${{ steps.plan.outputs.mode }}
      source_epoch: ${{ steps.plan.outputs.source_epoch }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
      - name: Plan package build or release
        id: plan
        shell: bash
        run: |
          set -euo pipefail

          version="$(bash scripts/project-metadata.sh version)"
          test -n "${version}"
          source_epoch="$(git show -s --format=%ct HEAD)"
          build_id="git-$(git rev-parse --short=12 HEAD)-$(
            date --utc --date="@${source_epoch}" '+%Y%m%d%H%M%S'
          )"

          mode=build
          tag=

          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            tag="${GITHUB_REF_NAME}"
            test "${tag}" = "v${version}"
            mode=release
          elif [[ "${GITHUB_EVENT_NAME}" == push &&
                  "${GITHUB_REF}" == refs/heads/main ]]; then
            previous_version="$(
              git show "${{ github.event.before }}:Cargo.toml" 2>/dev/null \
                | python3 -c '
          import sys
          import tomllib

          manifest = tomllib.load(sys.stdin.buffer)
          workspace_version = manifest.get("workspace", {}).get("package", {}).get("version")
          print(workspace_version or manifest["package"]["version"])
          ' \
                || true
            )"

            if [[ "${version}" == "${previous_version}" ]]; then
              mode=skip
            else
              tag="v${version}"
              if git show-ref --verify --quiet "refs/tags/${tag}"; then
                echo "::error::Tag ${tag} already exists."
                exit 1
              fi
              mode=tag
            fi
          fi

          {
            echo "build_id=${build_id}"
            echo "mode=${mode}"
            echo "source_epoch=${source_epoch}"
            echo "tag=${tag}"
            echo "version=${version}"
          } >>"${GITHUB_OUTPUT}"

  tag-release:
    if: needs.release-plan.outputs.mode == 'tag'
    needs: release-plan
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create release tag and start package workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-plan.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag --annotate "${RELEASE_TAG}" --message "Release ${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"
          gh workflow run packages.yml --ref "${RELEASE_TAG}"

  deb:
    if: >-
      needs.release-plan.outputs.mode == 'build' ||
      needs.release-plan.outputs.mode == 'release'
    needs: release-plan
    runs-on: ubuntu-24.04
    env:
      SOURCE_DATE_EPOCH: ${{ needs.release-plan.outputs.source_epoch }}
      WIREVIEW_BUILD_ID: ${{ needs.release-plan.outputs.build_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            dpkg-dev \
            libfontconfig1-dev \
            libudev-dev \
            xvfb
      - run: bash scripts/build-packages.sh deb
      - name: Test Debian package lifecycle
        run: |
          WIREVIEW_SKIP_BUILD=1 \
            WIREVIEW_DIST_DIR="${PWD}/target/previous-package" \
            WIREVIEW_PACKAGE_VERSION=0.999.0 \
            bash scripts/build-packages.sh deb
          sudo apt-get install --yes ./target/previous-package/*.deb
          sudo usermod --append --groups wireview-client "$(id -un)"
          sudo install -d /etc/systemd/system/wireviewd.service.d
          printf '%s\n' \
            '[Service]' \
            'ExecStart=' \
            'ExecStart=/usr/bin/wireviewd --mock' \
            | sudo tee /etc/systemd/system/wireviewd.service.d/ci.conf >/dev/null
          sudo systemctl daemon-reload
          sudo systemctl enable --now wireviewd.socket
          sudo systemctl restart wireviewd.service
          sudo -u "$(id -un)" -g wireview-client wireview status | grep -Fq 'api=2'
          sudo apt-get install --yes ./dist/*.deb
          cli_version="$(wireview version)"
          daemon_version="$(wireviewd --version)"
          gui_version="$(wireview-gui --version)"
          echo "${cli_version}"
          echo "${daemon_version}"
          echo "${gui_version}"
          test "${daemon_version}" = "${cli_version/wireview /wireviewd }"
          test "${gui_version}" = "${cli_version/wireview /wireview-gui }"
          sed -n 's/.*(build \(.*\))$/\1/p' <<<"${cli_version}" >dist/deb.build-id
          test -s dist/deb.build-id
          test -f /usr/lib/systemd/system/wireviewd.socket
          test -f /usr/share/applications/io.github.Gustav0ar.WireView.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/io.github.Gustav0ar.WireView.svg
          WIREVIEW_SKIP_BUILD=1 \
            WIREVIEW_SMOKE_BIN_DIR=/usr/bin \
            bash scripts/smoke-gui.sh
          sudo -u "$(id -un)" -g wireview-client wireview status | grep -Fq 'api=2'
          sudo systemctl stop wireviewd.service
          test "$(systemctl is-active wireviewd.socket)" = active
          sudo -u "$(id -un)" -g wireview-client wireview status | grep -Fq 'api=2'
          test "$(systemctl is-active wireviewd.service)" = active
          sudo systemctl restart wireviewd.service
          sudo -u "$(id -un)" -g wireview-client wireview status | grep -Fq 'api=2'
          sudo apt-get remove --yes wireviewd
          test ! -e /usr/bin/wireview
          test ! -e /usr/bin/wireview-gui
          sudo rm -f /etc/systemd/system/wireviewd.service.d/ci.conf
          sudo rmdir --ignore-fail-on-non-empty /etc/systemd/system/wireviewd.service.d
          sudo systemctl daemon-reload
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wireviewd-deb
          if-no-files-found: error
          path: |
            dist/*.deb
            dist/*.spdx.json
            dist/deb.build-id

  rpm:
    if: >-
      needs.release-plan.outputs.mode == 'build' ||
      needs.release-plan.outputs.mode == 'release'
    needs: release-plan
    runs-on: ubuntu-24.04
    container: fedora:43@sha256:762d73ba1c455232b0272c5d445a34f36c4b9f421cbc05ce8102552325b6a222
    env:
      SOURCE_DATE_EPOCH: ${{ needs.release-plan.outputs.source_epoch }}
      WIREVIEW_BUILD_ID: ${{ needs.release-plan.outputs.build_id }}
    steps:
      - name: Install runner dependencies
        run: >-
          dnf install --assumeyes
          fontconfig-devel gcc git libudev-devel python3 rpm-build
          xorg-x11-server-Xvfb
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
      - run: bash scripts/build-packages.sh rpm
      - name: Test RPM package lifecycle
        run: |
          WIREVIEW_SKIP_BUILD=1 \
            WIREVIEW_DIST_DIR="${PWD}/target/previous-package" \
            WIREVIEW_PACKAGE_VERSION=0.999.0 \
            bash scripts/build-packages.sh rpm
          dnf install --assumeyes target/previous-package/*.rpm
          dnf upgrade --assumeyes dist/*.rpm
          cli_version="$(wireview version)"
          daemon_version="$(wireviewd --version)"
          gui_version="$(wireview-gui --version)"
          echo "${cli_version}"
          echo "${daemon_version}"
          echo "${gui_version}"
          test "${daemon_version}" = "${cli_version/wireview /wireviewd }"
          test "${gui_version}" = "${cli_version/wireview /wireview-gui }"
          sed -n 's/.*(build \(.*\))$/\1/p' <<<"${cli_version}" >dist/rpm.build-id
          test -s dist/rpm.build-id
          test -f /usr/lib/systemd/system/wireviewd.socket
          test -f /usr/share/applications/io.github.Gustav0ar.WireView.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/io.github.Gustav0ar.WireView.svg
          WIREVIEW_SKIP_BUILD=1 \
            WIREVIEW_SMOKE_BIN_DIR=/usr/bin \
            bash scripts/smoke-gui.sh
          dnf remove --assumeyes wireviewd
          test ! -e /usr/bin/wireview
          test ! -e /usr/bin/wireview-gui
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wireviewd-rpm
          if-no-files-found: error
          path: |
            dist/*.rpm
            dist/rpm.build-id

  arch:
    if: >-
      needs.release-plan.outputs.mode == 'build' ||
      needs.release-plan.outputs.mode == 'release'
    needs: release-plan
    runs-on: ubuntu-24.04
    container: archlinux:base-devel@sha256:33c534be6c990710a878b37192904dd448e162ade06a201d95a80b42be2110c7
    env:
      SOURCE_DATE_EPOCH: ${{ needs.release-plan.outputs.source_epoch }}
      WIREVIEW_BUILD_ID: ${{ needs.release-plan.outputs.build_id }}
    steps:
      - name: Install runner dependencies
        run: >-
          pacman -Syu --noconfirm
          fontconfig git python rustup systemd xorg-server-xvfb
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure unprivileged package builder
        run: |
          useradd --create-home builder
          chown -R builder:builder "${GITHUB_WORKSPACE}"
          runuser -u builder -- rustup default 1.97.1
      - name: Build package
        run: runuser -u builder -- bash scripts/build-packages.sh arch
      - name: Test Arch package lifecycle
        run: |
          runuser -u builder -- env \
            WIREVIEW_SKIP_BUILD=1 \
            WIREVIEW_DIST_DIR="${PWD}/target/previous-package" \
            WIREVIEW_PACKAGE_VERSION=0.999.0 \
            bash scripts/build-packages.sh arch
          pacman -U --noconfirm target/previous-package/*.pkg.tar.zst
          pacman -U --noconfirm dist/*.pkg.tar.zst
          cli_version="$(wireview version)"
          daemon_version="$(wireviewd --version)"
          gui_version="$(wireview-gui --version)"
          echo "${cli_version}"
          echo "${daemon_version}"
          echo "${gui_version}"
          test "${daemon_version}" = "${cli_version/wireview /wireviewd }"
          test "${gui_version}" = "${cli_version/wireview /wireview-gui }"
          sed -n 's/.*(build \(.*\))$/\1/p' <<<"${cli_version}" >dist/arch.build-id
          test -s dist/arch.build-id
          test -f /usr/lib/systemd/system/wireviewd.socket
          test -f /usr/share/applications/io.github.Gustav0ar.WireView.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/io.github.Gustav0ar.WireView.svg
          WIREVIEW_SKIP_BUILD=1 \
            WIREVIEW_SMOKE_BIN_DIR=/usr/bin \
            bash scripts/smoke-gui.sh
          pacman -R --noconfirm wireviewd
          test ! -e /usr/bin/wireview
          test ! -e /usr/bin/wireview-gui
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wireviewd-arch
          if-no-files-found: error
          path: |
            dist/*.pkg.tar.zst
            dist/arch.build-id

  release:
    if: needs.release-plan.outputs.mode == 'release'
    needs: [release-plan, deb, rpm, arch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wireviewd-*
          path: release
          merge-multiple: true
      - name: Verify release package set and cross-package build identity
        env:
          EXPECTED_BUILD_ID: ${{ needs.release-plan.outputs.build_id }}
          RELEASE_TAG: ${{ needs.release-plan.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          version="${{ needs.release-plan.outputs.version }}"
          test "v${version}" = "${RELEASE_TAG}"
          test "${RELEASE_TAG}" = "${GITHUB_REF_NAME}"

          deb_packages=(release/*.deb)
          rpm_packages=(release/*.rpm)
          arch_packages=(release/*.pkg.tar.zst)
          sboms=(release/*.spdx.json)
          test "${#deb_packages[@]}" -eq 1
          test "${#rpm_packages[@]}" -eq 1
          test "${#arch_packages[@]}" -eq 1
          test "${#sboms[@]}" -eq 1
          test "$(basename "${deb_packages[0]}")" = \
            "wireviewd_${version}-1_amd64.deb"
          test "$(basename "${arch_packages[0]}")" = \
            "wireviewd-${version}-1-x86_64.pkg.tar.zst"
          test "$(basename "${sboms[0]}")" = "wireviewd.spdx.json"
          rpm_version="${version//./\\.}"
          rpm_name="$(basename "${rpm_packages[0]}")"
          if [[ ! "${rpm_name}" =~ \
            ^wireviewd-${rpm_version}-1(\.[[:alnum:]_]+)?\.x86_64\.rpm$ ]]; then
            echo "::error::Unexpected RPM package name: ${rpm_name}"
            exit 1
          fi

          test "$(find release -maxdepth 1 -name '*.build-id' -type f | wc -l)" -eq 3
          test "$(cat release/*.build-id | sort -u | wc -l)" -eq 1
          test "$(head -n 1 release/deb.build-id)" = "${EXPECTED_BUILD_ID}"
          rm release/*.build-id
      - name: Create checksums
        run: |
          cd release
          sha256sum ./* > SHA256SUMS
          sha256sum --check SHA256SUMS
          test "$(wc -l <SHA256SUMS)" -eq 4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign checksum manifest
        run: >-
          cosign sign-blob --yes
          --bundle release/SHA256SUMS.sigstore.json
          release/SHA256SUMS
      - name: Attest release provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: |
            release/*.deb
            release/*.rpm
            release/*.pkg.tar.zst
      - name: Attest release SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: |
            release/*.deb
            release/*.rpm
            release/*.pkg.tar.zst
          sbom-path: release/wireviewd.spdx.json
      - name: Generate commit changelog
        env:
          RELEASE_TAG: ${{ needs.release-plan.outputs.tag }}
        run: |
          set -euo pipefail
          previous_tag="$(
            git tag --merged HEAD --sort=-version:refname \
              | grep -Fxv "${RELEASE_TAG}" \
              | head -1 \
              || true
          )"
          range=HEAD
          if [[ -n "${previous_tag}" ]]; then
            range="${previous_tag}..HEAD"
          fi
          test "$(git rev-list --count "${range}")" -gt 0
          {
            echo "## Commit changelog"
            echo
            git log --reverse \
              --format="- [\`%h\`](https://github.com/${GITHUB_REPOSITORY}/commit/%H) %s" \
              "${range}"
          } >release-notes.md
      - name: Publish packages and generated changelog
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-plan.outputs.tag }}
        run: >-
          gh release create "${RELEASE_TAG}" release/*
          --generate-notes
          --fail-on-no-commits
          --notes-file release-notes.md
          --verify-tag
