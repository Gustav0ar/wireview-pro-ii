name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq libudev-dev systemd udev
      - run: cargo fmt --all --check
      - run: cargo check --all-targets --locked
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - name: Enforce dependency policy
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny check
      - run: bash scripts/smoke-varlink.sh
      - run: bash scripts/validate-packaging.sh
